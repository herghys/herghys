name: Sync Profile from herghys.github.io

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [site-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync README and hero banner from herghys.github.io
        run: node scripts/sync-profile.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md assets/hero-banner.svg; then
            echo "Profile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero-banner.svg
          git commit -m "chore: sync profile with herghys.github.io"
          git push
